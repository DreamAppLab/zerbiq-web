name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # GitHub runners can reach Google Fonts, so the build needs no font mock.
      - run: npm run build
      # CI=true: the built-pages test runs against the .next output and fails (never skips) if it is missing.
      - run: npm test
        env:
          CI: 'true'
